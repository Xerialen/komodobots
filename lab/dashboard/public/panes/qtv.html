<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>komodobots lab — live game pane</title>
  <!--
    LD-B2 (#88): standalone FTE QTV pane — the Live In-Game view.

    Modeled on the working precedents:
      - local-hub/web/watch.html  (FTE WASM QTV spectate baseline)
      - local-hub/frontend/src/pages/botlab/App.tsx  (retry/attach logic)
      - lab/dashboard/public/panes/demo.html  (same-origin postMessage pattern)

    The lab server (mvdsv/KTX) is ephemeral: it exists only while a session is
    running, so disconnect->retry is the NORMAL cycle, not an error (SPEC §3.5).
    The FTE engine is booted ONCE; subsequent attach/detach cycles are handled by
    re-issuing `qtvplay` without reloading the page.

    Params:  ?port=<labport>&relay=<ws-relay-url>&map=<mapname>
      - port:  QTV source port on the lab host (loopback on servexeri), default 28599
      - relay: fteqtv WebSocket relay URL, default ws://192.168.86.33:27599
      - map:   initial map name for .bsp preload, default dm3

    postMessage API (same-origin only):
      inbound  {cmd:"attach", port, relay?, map?}  -> issue qtvplay to new port
               {cmd:"disconnect"}                  -> disconnect from current stream
      outbound {evt:"status", state: "loading"|"connected"|"retrying"|"disconnected"}

    State machine:
      loading   — FTE engine booting (initial state; one-time at page load)
      connected — qtvplay succeeded (f_demostart fired: FTE confirmed game started)
      retrying  — no attempt running; retry loop active (~3 s period, SPEC §3.5)
      disconnected — explicit {cmd:"disconnect"} or unrecoverable engine boot failure

    FTE QTV disconnect detection: FTE prints "svc_disconnect: EndOfDemo" to the
    Module.print log whenever the QTV stream ends (server stopped / no stream).
    QTV connect detection accepts relay acceptance ("Welcome to FTEQTV" /
    "streaming ... via ..."), hook echoes such as f_demostart/autotrack, and
    runtime stream text such as "<player> entered the game"; some FTE builds
    execute f_demostart without echoing the alias command. As a fallback, after
    qtvplay is issued and no immediate disconnect arrives, the pane marks the
    attach connected so the shell does not stay in "retrying" while FTE is
    visibly receiving the stream. The retry loop re-issues qtvplay after
    QTV_RETRY_MS (3000 ms) so the pane re-attaches automatically when the next
    attempt starts.

    Map .bsp resolution: local-first (same as demo.html) — /maps/<map>.bsp on
    servexeri's web root first, CDN fallback. The relay URL comes from the parent
    dashboard rather than being baked in, so the pane works over ssh -L tunnels.

    FTE note: QTV streams do NOT have the same .qwd/.mvd extension constraint as
    demo files — qtvplay sends a TCP connection string, not a virtual file. The
    map .bsp is fetched via cl_download_mapsrc when FTE receives map info from
    the QTV stream, so the preloaded .bsp is an optimization only (not required
    for QTV to work).
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #06080d; color: #9ab; font: 13px monospace; overflow: hidden; }
    #fteCanvas { width: 100vw; height: 100vh; display: block; }
    #status { position: fixed; top: 8px; left: 10px; z-index: 10; white-space: pre; text-shadow: 0 0 3px #000; pointer-events: none; }
    /* POV picker bar — dashboard design language (dark navy, mono, emerald accent) */
    #povbar {
      position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%);
      z-index: 20; display: none; align-items: center; gap: 6px; flex-wrap: wrap;
      justify-content: center; max-width: calc(100vw - 20px);
      padding: 6px 10px; border: 1px solid #1c2a3a; border-radius: 8px;
      background: rgba(6, 10, 16, 0.85); backdrop-filter: blur(2px);
      transition: opacity 0.4s; opacity: 1;
    }
    #povbar.idle { opacity: 0; pointer-events: none; }
    #povbar .povlabel {
      font-size: 10px; letter-spacing: 0.14em; color: #64748b; text-transform: uppercase;
      margin-right: 2px; user-select: none;
    }
    #povbar .chip {
      font: 12px monospace; padding: 3px 9px; border-radius: 5px; cursor: pointer;
      border: 1px solid #22334a; background: rgba(15, 23, 36, 0.9); color: #9fb8cc;
      user-select: none; white-space: nowrap;
    }
    #povbar .chip:hover { border-color: #34d399; color: #d1fae5; }
    #povbar .chip.tracked {
      border-color: #34d399; background: rgba(16, 88, 60, 0.55); color: #6ee7b7; font-weight: bold;
    }
    #povbar .chip.auto.on {
      border-color: #fbbf24; background: rgba(120, 84, 10, 0.4); color: #fcd34d; font-weight: bold;
    }
    #povbar .chip .frags { color: #64748b; margin-left: 5px; font-weight: normal; }
    #povbar .chip.tracked .frags { color: #a7f3d0; }
    #povbar .teamsep { width: 1px; height: 16px; background: #22334a; margin: 0 2px; }
    #povbar .hint {
      font-size: 10px; color: #3d4f63; margin-left: 6px; user-select: none; white-space: nowrap;
    }
  </style>
</head>
<body>
  <canvas id="fteCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <div id="status">booting…</div>
  <div id="povbar"></div>

  <script>
    "use strict";
    // ---------------------------------------------------------------- params
    var q = new URLSearchParams(location.search);
    var PORT     = parseInt(q.get("port") || "28599", 10) || 28599;
    var RELAY    = q.get("relay") || "ws://192.168.86.33:27599";
    var MAP      = (q.get("map") || "dm3").toLowerCase();
    // Optional explicit upstream ("tcp:host:port"), e.g. a lanister bench
    // server; without it the relay pulls loopback on the lab host.
    var UPSTREAM = q.get("upstream") || null;

    // The relay pulls upstreams over loopback on the lab host (servexeri).
    var LAB_QTV_HOST = "127.0.0.1";
    var QTV_RETRY_MS = 3000;  // ~3 s retry loop (SPEC §3.5)
    var ASSUME_CONNECTED_AFTER_QTVPLAY_MS = 1500;

    var FTE  = "https://a.quake.world";        // FTE engine + fte/* assets
    var MAPS = "https://assets.quake.world";   // .bsp fallback CDN

    var EMBEDDED = (function () { try { return window.parent !== window; } catch (e) { return true; } })();

    // -------------------------------------------------------------- state
    // loading -> (connected | retrying) <-> connected  (never back to loading)
    // disconnected: explicit cmd or unrecoverable engine boot failure
    var state = "loading";
    var retryTimer = null;
    var attachConnectedTimer = null;
    var engineReady = false;   // FTE WASM ready (cbufadd available)
    var currentPort = PORT;    // port currently being watched

    var elStatus = document.getElementById("status");

    function post(msg) {
      if (!EMBEDDED) return;
      try { window.parent.postMessage(msg, location.origin); } catch (e) { /* detached */ }
    }
    function setState(next) {
      if (state === next) return;
      state = next;
      elStatus.textContent = next;
      post({ evt: "status", state: next });
    }

    function cbuf(cmd) {
      try { window.FTEC.cbufadd(cmd + "\n"); } catch (e) { console.warn("fte cbufadd:", e); }
    }

    // ----------------------------------------------- spectator UX (hub parity)
    // Ports hub.quakeworld.nu's FtePlayerCanvas key handling + FteController POV
    // cycling into this standalone embed (the hub does POV switching in JS off
    // the FTE module's player list — there is no engine-native next/prev-player
    // command). Refs:
    //   hub src/pages/games/player/FtePlayerCanvas.tsx  (Tab/Space key handlers)
    //   hub src/pages/games/fte/fteController.ts          (track / _trackByDelta)
    //   hub src/pages/games/fte/types.ts                  (ClientState/Player API)
    var consoleOpen = false;  // mirror of FTE console state (toggled on backquote)

    // Walk the FTE module's client-slot table the way the hub's getPlayers()
    // does: skip spectators and the ServeMe bot, return active player userids.
    // Sorted team-first so the POV bar groups the two teams together.
    function spectatablePlayers() {
      try {
        var st = window.Module.getClientState();
        var out = [];
        for (var i = 0; i < st.allocated_client_slots; i++) {
          var p = st.getPlayer(i);
          if (!p) continue;
          var nm = p.getNamePlain ? p.getNamePlain() : "";
          if (p.spectator !== 0 || nm === "" || nm === "[ServeMe]") continue;
          var tm = p.getTeamPlain ? p.getTeamPlain() : "";
          out.push({ userid: p.userid, name: nm, team: tm, frags: p.frags | 0 });
        }
        out.sort(function (a, b) {
          return a.team === b.team ? a.name.localeCompare(b.name)
                                   : a.team.localeCompare(b.team);
        });
        return out;
      } catch (e) { return []; }
    }
    function trackedUserid() {
      try {
        var p = window.Module.getClientState().getPlayerView(0).getTrackedPlayer();
        return p ? p.userid : null;
      } catch (e) { return null; }
    }
    // Manual POV pick: disable autotrack so it sticks (hub track() does the
    // same — Autotrack.OFF = "user", Autotrack.ON = "stats", per hub types.ts).
    var autotrackOn = true;   // f_demostart alias issues autotrack on connect
    function trackUser(userid) {
      autotrackOn = false;
      cbuf("cl_autotrack user");
      cbuf("track " + userid);
      renderPovBar();
    }
    function enableAutotrack() {
      autotrackOn = true;
      cbuf("cl_autotrack stats");
      renderPovBar();
    }
    function trackByDelta(delta) {
      var players = spectatablePlayers();
      if (players.length === 0) return;
      var ids = players.map(function (p) { return p.userid; });
      var cur = trackedUserid();
      var idx = cur === null ? -1 : ids.indexOf(cur);
      trackUser(ids[((idx === -1 ? 0 : idx) + delta + ids.length) % ids.length]);
    }

    // ------------------------------------------------------- POV picker bar
    // Visible player picker so POV choice needs no keyboard knowledge: one chip
    // per player (grouped by team, live frag count), an AUTO chip that restores
    // stats-based autotrack, and a key hint. Rebuilt only when content changes
    // so an imminent click isn't yanked from under the cursor.
    var elPovBar = document.getElementById("povbar");
    var povTimer = null;
    var povSignature = "";

    function renderPovBar() {
      var players = spectatablePlayers();
      if (players.length === 0) { elPovBar.style.display = "none"; povSignature = ""; return; }
      var tracked = trackedUserid();
      var sig = (autotrackOn ? "A" : "M") + "|" + tracked + "|" + players.map(function (p) {
        return p.userid + ":" + p.name + ":" + p.team + ":" + p.frags;
      }).join(",");
      if (sig === povSignature) return;
      povSignature = sig;

      elPovBar.innerHTML = "";
      var label = document.createElement("span");
      label.className = "povlabel";
      label.textContent = "pov";
      elPovBar.appendChild(label);

      var auto = document.createElement("span");
      auto.className = "chip auto" + (autotrackOn ? " on" : "");
      auto.textContent = "AUTO";
      auto.title = "follow the action automatically (cl_autotrack stats)";
      auto.addEventListener("mousedown", function (e) { e.preventDefault(); });
      auto.addEventListener("click", enableAutotrack);
      elPovBar.appendChild(auto);

      var prevTeam = null;
      players.forEach(function (p) {
        if (prevTeam !== null && p.team !== prevTeam) {
          var sep = document.createElement("span");
          sep.className = "teamsep";
          elPovBar.appendChild(sep);
        }
        prevTeam = p.team;
        var chip = document.createElement("span");
        chip.className = "chip" + (p.userid === tracked ? " tracked" : "");
        chip.title = "track " + p.name + (p.team ? " (team " + p.team + ")" : "");
        chip.textContent = p.name;
        var fr = document.createElement("span");
        fr.className = "frags";
        fr.textContent = String(p.frags);
        chip.appendChild(fr);
        // preventDefault on mousedown keeps keyboard focus on the canvas so
        // Space/arrows still cycle POV right after a click.
        chip.addEventListener("mousedown", function (e) { e.preventDefault(); });
        chip.addEventListener("click", function () { trackUser(p.userid); });
        elPovBar.appendChild(chip);
      });

      var hint = document.createElement("span");
      hint.className = "hint";
      hint.textContent = "space next · ←→ cycle · tab scores";
      elPovBar.appendChild(hint);
      elPovBar.style.display = "flex";
    }

    function startPovBar() {
      if (povTimer !== null) return;
      povTimer = setInterval(renderPovBar, 700);
      renderPovBar();
    }
    function stopPovBar() {
      if (povTimer !== null) { clearInterval(povTimer); povTimer = null; }
      elPovBar.style.display = "none";
      povSignature = "";
    }

    // Fade the bar after mouse idle (like the hub player's control bar);
    // reappear on any mouse movement.
    (function () {
      var idleTimer = null;
      function poke() {
        elPovBar.classList.remove("idle");
        if (idleTimer !== null) clearTimeout(idleTimer);
        idleTimer = setTimeout(function () { elPovBar.classList.add("idle"); }, 4000);
      }
      document.addEventListener("mousemove", poke);
      poke();
    })();

    // Keyboard: Tab -> scoreboard (hold), Space/Right -> next POV, Left -> prev.
    // Backquote toggles the console (so Tab is forwarded to scores, not eaten
    // while typing). Guarded by consoleOpen exactly like the hub.
    document.addEventListener("keydown", function (e) {
      if (e.code === "Backquote") { consoleOpen = !consoleOpen; cbuf("toggleconsole"); e.preventDefault(); return; }
      if (consoleOpen) return;
      switch (e.code) {
        case "Tab":        e.preventDefault(); cbuf("+showscores"); break;
        case "ArrowLeft":  e.preventDefault(); trackByDelta(-1);   break;
        case "ArrowRight": e.preventDefault(); trackByDelta(1);    break;
      }
    });
    document.addEventListener("keyup", function (e) {
      if (consoleOpen) return;
      switch (e.code) {
        case "Tab":   e.preventDefault(); cbuf("-showscores"); break;
        case "Space": e.preventDefault(); trackByDelta(1);     break;
      }
    });
    // Click the canvas to focus it (so key events land here, not the browser)
    // and to advance POV — mirrors the hub's tap-to-track-next affordance.
    (function () {
      var cv = document.getElementById("fteCanvas");
      cv.addEventListener("mousedown", function () { cv.focus(); });
      cv.addEventListener("dblclick", function () { trackByDelta(1); });
    })();

    function isQtvConnectedLog(text) {
      return text.indexOf("Welcome to FTEQTV") !== -1 ||
             (text.indexOf("streaming \"") !== -1 && text.indexOf("\" via \"") !== -1) ||
             text.indexOf("f_demostart") !== -1 ||
             text.indexOf("autotrack") !== -1 ||
             text.indexOf(" entered the game") !== -1 ||
             text.indexOf("Server starts recording") !== -1;
    }

    // ---------------------------------------------------------------- attach
    // Issue qtvplay for the current port. Called:
    //   (a) once when FTE becomes ready
    //   (b) on every new attempt (via {cmd:"attach"} postMessage)
    //   (c) ~3 s after every QTV disconnect (retry loop)
    function attach(port, relay, map) {
      currentPort = port || currentPort;
      RELAY  = relay  || RELAY;
      MAP    = (map || MAP).toLowerCase();
      if (!engineReady) return;  // will be called again from waitForEngine
      clearRetry();
      setState("retrying");   // not confirmed connected until f_demostart fires
      cbuf("disconnect");
      cbuf("closemenu");
      var upstream = UPSTREAM || ("tcp:" + LAB_QTV_HOST + ":" + currentPort);
      cbuf("qtvplay " + upstream + "@" + RELAY);
      scheduleAttachConnectedFallback();
    }

    // ------------------------------------------------------------- retry loop
    function scheduleRetry() {
      clearRetry();
      retryTimer = setTimeout(function () {
        retryTimer = null;
        attach(currentPort, RELAY, MAP);
      }, QTV_RETRY_MS);
    }
    function clearRetry() {
      if (retryTimer !== null) { clearTimeout(retryTimer); retryTimer = null; }
    }
    function scheduleAttachConnectedFallback() {
      clearAttachConnectedFallback();
      attachConnectedTimer = setTimeout(function () {
        attachConnectedTimer = null;
        if (state !== "retrying") return;
        // Confirm via the client-state API instead of assuming: if the stream
        // is actually delivering players we're connected; otherwise the
        // qtvplay was swallowed (engine-boot race — cbuf commands issued in
        // the first moments after FTEC appears can be dropped silently, seen
        // 2026-07-07) and we go around the normal retry loop, which
        // re-issues qtvplay every QTV_RETRY_MS.
        if (spectatablePlayers().length > 0) {
          setState("connected");
          startPovBar();
        } else {
          scheduleRetry();
        }
      }, ASSUME_CONNECTED_AFTER_QTVPLAY_MS);
    }
    function clearAttachConnectedFallback() {
      if (attachConnectedTimer !== null) {
        clearTimeout(attachConnectedTimer);
        attachConnectedTimer = null;
      }
    }

    // ------------------------------------------------- postMessage (inbound)
    window.addEventListener("message", function (ev) {
      if (ev.origin !== location.origin) return;
      var m = ev.data;
      if (!m || typeof m !== "object" || !m.cmd) return;
      switch (m.cmd) {
        case "attach":
          attach(m.port || currentPort, m.relay || RELAY, m.map || MAP);
          break;
        case "disconnect":
          clearRetry();
          stopPovBar();
          setState("disconnected");
          if (engineReady) { cbuf("disconnect"); }
          break;
      }
    });

      "id1/gfx/anum_5.png","id1/gfx/anum_6.png","id1/gfx/anum_7.png","id1/gfx/anum_8.png","id1/gfx/anum_9.png",
      "id1/gfx/anum_colon.png","id1/gfx/anum_minus.png","id1/gfx/anum_slash.png",
      "id1/gfx/face1.png","id1/gfx/face2.png","id1/gfx/face3.png","id1/gfx/face4.png","id1/gfx/face5.png",
      "id1/gfx/face_inv2.png","id1/gfx/face_invis.png","id1/gfx/face_invul2.png",

      "id1/gfx/face_quad.png","id1/gfx/ibar.png",

      "id1/gfx/inv2_snailgun.png","id1/gfx/inv2_srlaunch.png","id1/gfx/inv2_sshotgun.png",

      "id1/gfx/inv_rocket.png","id1/gfx/inv_shells.png","id1/gfx/inv_shotgun.png","id1/gfx/inv_snailgun.png",
      "id1/gfx/inv_srlaunch.png","id1/gfx/inv_sshotgun.png",

    // ------------------------------------------------------------------ boot
    function headOk(url) {
      return fetch(url, { method: "HEAD" }).then(function (r) { return r.ok; }).catch(function () { return false; });
    }

    function boot(mapUrl) {
      var files = { "qw/csaddon.dat": FTE + "/fte/csaddon/csaddon_003.dat" };
      for (var i = 0; i < filePaths.length; i++) files[filePaths[i]] = FTE + "/fte/" + filePaths[i];
      // QTV config: mapped to id1/config.cfg (same pattern as demo.html)
      files["id1/config.cfg"] = new URL("fte_qtv.cfg", location.href).toString();
      // Preload the initial map .bsp so the first connection renders faster.
      // FTE will also fetch maps via cl_download_mapsrc on QTV connect, so this
      // is purely an optimization — QTV does not require a pre-mapped .bsp.
      if (MAP && mapUrl) files["id1/maps/" + MAP + ".bsp"] = mapUrl;
      var manifestUrl = FTE + "/fte/default.fmf";

      window.Module = {
        canvas: document.getElementById("fteCanvas"),
        manifest: manifestUrl,
        arguments: ["-manifest", manifestUrl],
        files: files,
        print: function (text) {
          if (typeof text !== "string") return;
          console.log(text);
          // QTV stream end: FTE prints this when the server stops or no stream
          // is available (identical to the hub's fte.event.qtv_disconnect signal).
          if (text.indexOf("svc_disconnect: EndOfDemo") !== -1) {
            onQtvDisconnect();
          }
          // QTV connect confirmed: map loaded and the spectator entered a live
          // game. Some FTE builds execute f_demostart without echoing it, so
          // runtime stream messages are accepted too.
          if (isQtvConnectedLog(text)) {
            onQtvConnected();
          }
        },
        printErr: function (text) {
          if (typeof text !== "string") return;
          console.warn(text);
          if (text.indexOf("svc_disconnect: EndOfDemo") !== -1) {
            onQtvDisconnect();
          }
        },
        setStatus: function (v) { if (v && state === "loading") elStatus.textContent = "loading: " + v; },
      };

      var s = document.createElement("script");
      s.src = FTE + "/fte/versions/004/ftewebgl.js";
      s.onerror = function () {
        setState("disconnected");
        elStatus.textContent = "FTE engine failed to load from " + s.src;
      };
      document.body.appendChild(s);

      waitForEngine();
    }

    function onQtvConnected() {
      if (state === "disconnected") return;
      clearAttachConnectedFallback();
      clearRetry();
      setState("connected");
      autotrackOn = true;   // f_demostart re-issues autotrack on every connect
      startPovBar();
    }

    function onQtvDisconnect() {
      if (state === "disconnected") return;  // explicit disconnect — do not retry
      clearAttachConnectedFallback();
      stopPovBar();
      setState("retrying");
      scheduleRetry();
    }

    function waitForEngine() {
      var tries = 0;
      var poll = setInterval(function () {
        tries++;
        var ready = window.FTEC && typeof window.FTEC.cbufadd === "function" &&
                    window.Module && typeof window.Module.getClientState === "function";
        if (ready) {
          clearInterval(poll);
          engineReady = true;
          cbuf("closemenu");
          try { document.getElementById("fteCanvas").focus(); } catch (e) {}
          // Initial attach: issue qtvplay for the boot-time port.
          setState("retrying");
          attach(currentPort, RELAY, MAP);
        } else if (tries > 600) {   // ~2 min
          clearInterval(poll);
          setState("disconnected");
          elStatus.textContent = "FTE did not become ready within 2 minutes (check console)";
        }
      }, 200);
    }

    // ----------------------------------------------------------------- start
    setState("loading");
    // Local-first map resolution: our web tier first, CDN fallback (same as demo.html).
    var localBsp = "/maps/" + MAP + ".bsp";
    headOk(localBsp).then(function (localOk) {
      boot(localOk ? localBsp : (MAP ? MAPS + "/maps/" + MAP + ".bsp" : null));
    });
  </script>
