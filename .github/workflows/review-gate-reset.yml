name: Reset Review Gate

# A pushed commit invalidates any previous review-gate decision.
# This keeps the label gate from going stale: new commits clear ready/blocked
# and set `gate: reviewing`, forcing a fresh Reviewer pass before any merge.

on:
  pull_request:
    types: [synchronize]

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: review-gate-reset-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clear stale gate labels on new commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          gh pr edit "$PR" -R "$REPO" --remove-label "gate: ready" || true
          gh pr edit "$PR" -R "$REPO" --remove-label "gate: blocked" || true
          gh pr edit "$PR" -R "$REPO" --add-label "gate: reviewing" || true
          # IMPORTANT: do NOT put "@codex review" (or any @codex mention) in this
          # comment. It posts as github-actions[bot], which is not a Codex-linked
          # identity, so the connector replies "create a Codex account…" on every
          # reset — pure noise. Re-review happens via auto-review / a human ping.
          gh pr comment "$PR" -R "$REPO" \
            --body "🔄 Review gate reset — new commits were pushed, so the previous gate decision no longer applies. A fresh review is required before this PR can merge."
