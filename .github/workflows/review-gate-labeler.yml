name: Review Gate Labeler

# Bridges the Reviewer (Codex) to the neutral merge gate WITHOUT an LLM.
#
# Codex's code-review feature cannot apply labels itself and won't emit custom
# tokens — it posts its own native review. This deterministic workflow reads
# that native result and stamps the gate label the merge executor consumes:
#
#   - Codex clean verdict ("no major issues")        -> `gate: ready`
#   - Codex posted review suggestions / findings     -> `gate: blocked`
#
# It fails CLOSED: anything it cannot positively classify as clean leaves the
# gate un-readied. A repo OWNER can override by commenting `/gate ready` or
# `/gate blocked` (human safety valve).

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: review-gate-labeler-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label:
    # Only act on PRs, and only for Codex's review output or an owner override.
    if: >-
      ${{
        (github.event.issue.pull_request && (
          startsWith(github.event.comment.user.login, 'chatgpt-codex-connector')
          || github.event.comment.author_association == 'OWNER'
        ))
        || (github.event.review && (
          startsWith(github.event.review.user.login, 'chatgpt-codex-connector')
          || github.event.review.author_association == 'OWNER'
        ))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Translate review result into gate label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
          BODY: ${{ github.event.comment.body || github.event.review.body }}
          ACTOR: ${{ github.event.comment.user.login || github.event.review.user.login }}
          ASSOC: ${{ github.event.comment.author_association || github.event.review.author_association }}
        run: |
          set -euo pipefail

          ready()   { gh pr edit "$PR" -R "$REPO" --remove-label "gate: blocked"   --remove-label "gate: reviewing" --add-label "gate: ready";    echo "set gate: ready"; }
          blocked() { gh pr edit "$PR" -R "$REPO" --remove-label "gate: ready"      --remove-label "gate: reviewing" --add-label "gate: blocked";  echo "set gate: blocked"; }

          body_lc=$(printf '%s' "$BODY" | tr '[:upper:]' '[:lower:]')

          # --- Human owner override (explicit, highest priority) ---
          if [ "$ASSOC" = "OWNER" ]; then
            case "$body_lc" in
              *"/gate ready"*)   ready;   exit 0 ;;
              *"/gate blocked"*) blocked; exit 0 ;;
            esac
          fi

          # --- Codex native review result ---
          case "$ACTOR" in
            chatgpt-codex-connector*)
              # Clean verdict -> ready. Codex's standard clean phrasing.
              case "$body_lc" in
                *"didn't find any major issues"*|*"didnt find any major issues"*|*"no major issues"*|*"no issues found"*)
                  ready; exit 0 ;;
              esac
              # Suggestions/findings posted -> block until addressed and re-reviewed.
              case "$body_lc" in
                *"automated review suggestions"*|*"p0 badge"*|*"p1 badge"*|*"p2 badge"*|*"![p0"*|*"![p1"*|*"![p2"*)
                  blocked; exit 0 ;;
              esac
              ;;
          esac

          echo "No deterministic gate signal in this event; leaving gate unchanged (fail-closed)."
