name: Gemini Merger

# The Merger role from AGENTS.md, run by Gemini as a GitHub Action.
#
# Cost guardrails (both axes must stay free):
#   * Gemini: uses the Google AI Studio FREE tier via secrets.GEMINI_API_KEY on a
#     Flash model. Keep that key's Google Cloud project on the free tier (billing
#     DISABLED) so it can never be metered — over-quota just returns 429.
#   * GitHub Actions minutes: event-driven only, NEVER a schedule/poll, so this
#     burns almost no minutes on this private repo. It wakes only when the
#     Reviewer (Codex) posts a "MERGER: READY" verdict, or Benjamin comments
#     "@gemini-cli /merge".
#
# Authority: autonomous-on-gates. It merges only when every AGENTS.md "Merge gate
# rule" condition holds, including a Reviewer READY verdict whose SHA matches the
# current PR head. Otherwise it refuses with one comment and never merges.

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: gemini-merger-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  merge-gate:
    # Trigger filter == the whole automation policy. Act only on PRs, only on
    # comments/reviews from the repo owner (Benjamin and his agents run as OWNER),
    # and only when there is a Reviewer READY verdict or an explicit merge request.
    if: >-
      ${{
        (github.event.issue.pull_request &&
         github.event.comment.author_association == 'OWNER' &&
         (contains(github.event.comment.body, 'MERGER: READY') ||
          contains(github.event.comment.body, '@gemini-cli /merge')))
        ||
        (github.event.review.author_association == 'OWNER' &&
         contains(github.event.review.body, 'MERGER: READY'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve PR number
        id: pr
        env:
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: echo "number=${NUM}" >> "$GITHUB_OUTPUT"

      - name: Run Gemini Merger
        uses: google-github-actions/run-gemini-cli@v0 # ratchet:exclude
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          # Free-tier model only. Override with a repo variable if ever needed,
          # but keep it a Flash model so usage stays non-metered.
          gemini_model: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          github_pr_number: ${{ steps.pr.outputs.number }}
          settings: |-
            {
              "model": { "maxSessionTurns": 20 },
              "telemetry": { "enabled": false },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run", "-i", "--rm",
                    "-e", "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "pull_request_read",
                    "merge_pull_request",
                    "add_issue_comment",
                    "get_file_contents",
                    "list_commits"
                  ],
                  "env": { "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}" }
                }
              },
              "tools": { "core": [] }
            }
          prompt: |-
            You are the **Merger** for repository ${{ github.repository }}, pull request #${{ steps.pr.outputs.number }}.

            Your contract is AGENTS.md in this repository. Read it first with get_file_contents
            and obey its "Merge gate rule", "Reviewer verdict rule", and the Merger hard rules
            exactly. Use ONLY the github MCP tools. Be terse.

            Steps:
            1. pull_request_read the PR: capture its current head SHA, base ref, draft state,
               mergeable state, and the checks/status rollup.
            2. pull_request_read the PR reviews and issue comments. Find the LATEST Reviewer
               verdict line: "MERGER: READY", "MERGER: READY_WITH_NON_BLOCKING_CAVEATS", or
               "MERGER: BLOCKED". The verdict MUST cite a commit SHA, and that SHA MUST equal
               the PR's current head SHA. A verdict whose SHA != current head SHA is STALE.
            3. Merge with merge_pull_request (squash) ONLY IF ALL hold:
               - open and not a draft
               - base branch is main
               - mergeable (no conflicts)
               - all required checks pass; if there are no checks, say so explicitly
               - a current-head-SHA Reviewer verdict of READY or READY_WITH_NON_BLOCKING_CAVEATS exists
               - no later-stage work and no unresolved actionable review feedback
            4. After a successful merge, add_issue_comment with ONE comment recording: gate
               result, the verdict SHA you consumed, the checks state, and one line on what merged.
            5. If ANY gate fails — including a STALE verdict — DO NOT merge. add_issue_comment with
               ONE comment naming exactly which gate failed; if the verdict is stale, request a
               fresh Reviewer review. Then stop.

            Never implement code, never fix tests, never write a review, never start the next stage.
